<section class="hero">
  <div class="container hero-grid">
    <div class="hero-content">
      <span class="hero-tag">PREMIUM CLEANING SERVICE</span>

      <h1>
        Super Magic Mop <br />
        Cleaning Services
      </h1>

      <p>
        Professional home cleaning services designed for clients who expect quality, reliability,
        and attention to detail.
      </p>

      <div class="hero-buttons">
        <a href="/services" class="btn btn-gold" (click)="goToBookNow(); $event.preventDefault()">Book Cleaning</a>
        <a routerLink="/services" class="btn btn-outline">View Services</a>
      </div>

      <div class="hero-stats">
        <div class="stat">
          <h3>500+</h3>
          <span>Homes Cleaned</span>
        </div>

        <div class="stat">
          <h3>4.9★</h3>
          <span>Customer Rating</span>
        </div>

        <div class="stat">
          <h3>24/7</h3>
          <span>Customer Support</span>
        </div>
      </div>
    </div>

    <div class="hero-image">
      <img src="/images/medium-shot-people-cleaning-building.jpg" alt="Cleaning Service" />
    </div>
  </div>
</section>
